name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and attach artifacts
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Publish first: `prepublishOnly` re-runs the build with tsup clean:true,
      # which would wipe any tarball packed beforehand.
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack tarball
        run: |
          npm pack --pack-destination dist
          TARBALL="dist/opencode-dcp-$(node -p "require('./package.json').version").tgz"
          test -f "$TARBALL" || { echo "::error::expected $TARBALL"; ls -la dist/; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "opencode-dcp ${GITHUB_REF_NAME#v}" \
            "dist/opencode-dcp-$(node -p "require('./package.json').version").tgz"

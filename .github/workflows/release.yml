name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and attach artifacts
  id-token: write # OIDC trusted publishing + SLSA provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs aube onto PATH plus Node 24 via mise — replaces actions/setup-node.
      - uses: jdx/aube-action@v1
        with:
          version: latest
          node-version: "24"

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      # Frozen clean install; aube reads package-lock.json natively.
      - run: aube ci
      - run: aube run typecheck
      - run: aube test

      # Build explicitly: publish below passes --ignore-scripts, so the
      # prepublishOnly hook (typecheck/test/build) will NOT re-run and
      # cannot wipe dist/ out from under us.
      - run: aube run build

      # Auth: npm classic tokens were permanently revoked Dec 2025 and
      # granular tokens expire every 90 days, so there is intentionally NO
      # NPM_TOKEN secret here. The job's short-lived OIDC token authenticates
      # against the "Trusted Publisher" configured on npmjs.com for
      # opencode-dcp (provider: GitHub Actions, repo: arafays/opencode-dcp,
      # workflow: release.yml). Requires npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing + provenance)
        # Explicit dist-tag: npm refuses to publish prerelease versions
        # without --tag, and this project ships every release (betas
        # included) under `latest`.
        run: npm publish --access public --provenance --ignore-scripts --tag latest

      - name: Pack tarball
        run: |
          aube pack --pack-destination dist
          TARBALL="dist/opencode-dcp-$(node -p "require('./package.json').version").tgz"
          test -f "$TARBALL" || { echo "::error::expected $TARBALL"; ls -la dist/; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "opencode-dcp ${GITHUB_REF_NAME#v}" \
            "dist/opencode-dcp-$(node -p "require('./package.json').version").tgz"
